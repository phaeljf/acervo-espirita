<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="topbar(pageTitle)" class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">

    <h2 class="fw-bold mb-0" th:text="${pageTitle}"></h2>

    <div class="d-flex align-items-center gap-3">

        <span class="fw-semibold" th:text="${loggedUser.name}"></span>

        <a href="/logout" class="btn btn-outline-danger btn-sm">
            Sair
        </a>

    </div>

</div>

</body>
</html>

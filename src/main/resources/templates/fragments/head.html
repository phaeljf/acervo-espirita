<head th:fragment="head(title)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${title}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        .sidebar-link{
            color:white;
            text-decoration:none;
            transition:0.2s;
            border-radius:8px;
            font-weight:500;
        }

        .sidebar-link:hover{
            color:#ffd6d6;
            background:rgba(255,255,255,0.12);
            padding-left:14px;
        }

        .sidebar-section{
            color:rgba(255,255,255,0.65);
            font-size:12px;
            font-weight:bold;
            text-transform:uppercase;
            margin-bottom:8px;
        }

        html,body{
            margin:0;
            padding:0;
            height:100%;
        }

    </style>

</head>

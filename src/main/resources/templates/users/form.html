<!-- users/form.html -->

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${user != null && user.id != null ? 'Editar Usuário' : 'Novo Usuário'})}"></head>

<body class="bg-light">

<div class="d-flex min-vh-100">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-4">

        <div th:replace="~{fragments/topbar :: topbar(${user != null && user.id != null ? 'Editar Usuário' : 'Novo Usuário'})}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">

            <a href="/users" class="btn btn-outline-secondary btn-sm"> ← Voltar </a>

        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <form th:action="${user != null && user.id != null ? '/users/' + user.id : '/users'}"
                      method="post">

                    <div class="row g-4">

                        <div class="col-md-6">

                            <div class="small text-muted mb-1"> Nome </div>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   th:value="${user != null ? user.name : ''}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <div class="small text-muted mb-1"> Usuário </div>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   th:value="${user != null ? user.username : ''}"
                                   th:readonly="${user != null && user.id != null}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <div class="small text-muted mb-1"> E-mail </div>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${user != null ? user.email : ''}"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <div class="small text-muted mb-1"> Telefone </div>

                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   th:value="${user != null ? user.phone : ''}">

                        </div>

                        <div class="col-md-6">

                            <div class="small text-muted mb-1"> Cargo </div>

                            <select name="role" class="form-select" th:disabled="${!loggedUser.admin}">
                                <option th:each="role : ${roles}"
                                        th:value="${role}"
                                        th:text="${role}"
                                        th:selected="${user != null && user.role == role}">
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6" th:if="${user != null && user.id != null}">

                            <div class="small text-muted mb-1"> Status </div>

                            <div>

                                <span th:if="${user.active}" class="badge bg-success"> ATIVO </span>
                                <span th:if="${!user.active}" class="badge bg-secondary"> INATIVO </span>

                            </div>

                        </div>

                        <div class="col-md-6" th:if="${user != null && user.id != null}">

                            <div class="small text-muted mb-1"> Criado em </div>

                            <div class="fw-bold"
                                 th:text="${#temporals.format(user.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy HH:mm')}">
                            </div>

                        </div>

                        <div class="col-md-6" th:if="${user != null && user.id != null}">

                            <div class="small text-muted mb-1"> Atualizado em </div>

                            <div class="fw-bold"
                                 th:text="${#temporals.format(user.updatedAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy HH:mm')}">
                            </div>

                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">

                        <button type="submit" class="btn btn-primary"> Salvar </button>

                        <a href="/users" class="btn btn-secondary"> Cancelar </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>

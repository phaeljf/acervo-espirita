<!-- users/details.html -->

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Visualizar Usuário')}"></head>

<body class="bg-light">

<div class="d-flex min-vh-100">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-4">

        <div th:replace="~{fragments/topbar :: topbar('Usuário ' + ${user.name})}"></div>

        <div class="d-flex gap-2 mb-3">

            <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm"> ← Voltar </a>

            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-warning btn-sm"> Editar </a>

        </div>

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-4">

                    <div class="col-md-4">
                        <div class="small text-muted"> Nome </div>
                        <div class="fw-bold" th:text="${user.name}"></div>
                    </div>

                    <div class="col-md-4">
                        <div class="small text-muted"> Usuário </div>
                        <div class="fw-bold" th:text="${user.username}"></div>
                    </div>

                    <div class="col-md-4">

                        <div class="small text-muted"> Cargo </div>

                        <div>
                            <span th:if="${user.role.name() == 'USER'}" class="badge bg-secondary"> USER </span>
                            <span th:if="${user.role.name() == 'STAFF'}" class="badge bg-primary"> STAFF </span>
                            <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger"> ADMIN </span>
                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="small text-muted"> Status </div>

                        <div>
                            <span th:if="${user.active}" class="badge bg-success"> ATIVO </span>
                            <span th:if="${!user.active}" class="badge bg-secondary"> INATIVO </span>
                        </div>

                    </div>

                    <div class="col-md-4">
                        <div class="small text-muted"> E-mail </div>
                        <div class="fw-bold" th:text="${user.email != null && !user.email.isBlank() ? user.email : '-'}"></div>
                    </div>

                    <div class="col-md-4">
                        <div class="small text-muted"> Telefone </div>
                        <div class="fw-bold" th:text="${user.phone != null && !user.phone.isBlank() ? user.phone : '-'}"></div>
                    </div>

                    <div class="col-md-4">
                        <div class="small text-muted"> Criado em </div>
                        <div class="fw-bold" th:text="${#temporals.format(user.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy HH:mm')}"></div>
                    </div>

                    <div class="col-md-4">
                        <div class="small text-muted"> Atualizado em </div>
                        <div class="fw-bold" th:text="${#temporals.format(user.updatedAt.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy HH:mm')}"></div>
                    </div>

                    <div class="col-md-4">

                        <div class="small text-muted"> Empréstimo Ativo </div>

                        <div th:if="${user.activeLoan != null}">
                            <a th:href="@{/loan/{id}(id=${user.activeLoan.id})}" class="btn btn-sm btn-outline-primary">
                                Empréstimo Nº <span th:text="${user.activeLoan.id}"></span>
                            </a>
                        </div>

                        <div th:if="${user.activeLoan == null}" class="fw-bold text-muted">
                            Nenhum empréstimo ativo
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-body p-0">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th>ID</th>
                        <th>Status</th>
                        <th>Quantidade</th>
                        <th>Data Empréstimo</th>
                        <th>Vencimento</th>
                        <th>Ações</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(user.loans)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            Nenhum empréstimo encontrado.
                        </td>
                    </tr>

                    <tr th:each="loan : ${user.loans}">

                        <td th:text="${loan.id}"></td>

                        <td>
                            <span th:if="${loan.active}" class="badge bg-primary"> ABERTO </span>
                            <span th:if="${loan.closed}" class="badge bg-success"> FINALIZADO </span>
                            <span th:if="${loan.overdue}" class="badge bg-danger"> ATRASADO </span>
                        </td>

                        <td th:text="${loan.items.size()}"></td>

                        <td th:text="${#temporals.format(loan.loanDate.atZone(T(java.time.ZoneId).systemDefault()), 'dd/MM/yyyy')}"></td>

                        <td th:text="${#temporals.format(loan.dueDate, 'dd/MM/yyyy')}"></td>

                        <td>

                            <div class="d-flex gap-2">

                                <a th:href="@{/loan/{id}(id=${loan.id})}" class="btn btn-sm btn-outline-primary"> Visualizar </a>

                                <a th:if="${loan.active}"
                                   th:href="@{/loan/{id}/return(id=${loan.id})}"
                                   class="btn btn-sm btn-success">
                                    Devolução
                                </a>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Prateleiras')}"></head>

<body class="bg-light">

<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTEÚDO -->
    <div class="flex-grow-1 p-4">

        <div th:replace="~{fragments/topbar :: topbar('Prateleiras')}"></div>

        <!-- TÍTULO -->
        <div class="mb-4">
            <h4 th:text="'Estante: ' + ${shelf.name}"></h4>
        </div>

        <!-- NOVA PRATELEIRA -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/shelves/{id}/positions/add(id=${shelf.id})}" method="post">
                    <div class="d-flex gap-2">
                        <input type="text" name="positionName" class="form-control" placeholder="Nome da Prateleira">
                        <button type="submit" class="btn btn-primary">
                            Adicionar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- LISTA -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Prateleira</th>
                        <th>Posição Completa</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="position : ${shelf.positions}">
                        <td th:text="${position.name}"></td>
                        <td th:text="${position.fullPosition}"></td>
                        <td>
                            <form th:action="@{/shelves/{shelfId}/positions/remove/{positionId}(shelfId=${shelf.id},positionId=${position.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    Excluir
                                </button>
                            </form>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- VOLTAR -->
        <div class="mt-3">
            <a href="/locations" class="btn btn-secondary">Voltar</a>
        </div>

    </div>

</div>

</body>
</html>

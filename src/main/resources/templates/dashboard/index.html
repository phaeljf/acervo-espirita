<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>
<body class="bg-light">
<div class="d-flex">
    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <!-- CONTEÚDO -->
    <div class="flex-grow-1 p-4">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/topbar :: topbar('Dashboard')}"></div>
        <!-- ACERVO -->
        <div class="mb-3">
            <h4 class="fw-bold">
                📚 Acervo
            </h4>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Total de Obras
                        </h6>
                        <h2 th:text="${dashboard.totalBooks}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Total de Exemplares
                        </h6>
                        <h2 th:text="${dashboard.totalCopies}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Exemplares Disponíveis
                        </h6>
                        <h2 class="text-success"
                            th:text="${dashboard.availableCopies}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Exemplares Emprestados
                        </h6>
                        <h2 class="text-danger"
                            th:text="${dashboard.loanedCopies}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
        </div>
        <!-- EMPRÉSTIMOS -->
        <div class="mt-4 mb-3">
            <h4 class="fw-bold">
                🔄 Empréstimos
            </h4>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Empréstimos Ativos
                        </h6>
                        <h2 class="text-primary"
                            th:text="${dashboard.activeLoans}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Empréstimos Atrasados
                        </h6>
                        <h2 class="text-danger"
                            th:text="${dashboard.overdueLoans}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
        </div>
        <!-- USUÁRIOS -->
        <div class="mt-4 mb-3">
            <h4 class="fw-bold">
                👥 Usuários
            </h4>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Total de Usuários
                        </h6>
                        <h2 th:text="${dashboard.totalUsers}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Administradores
                        </h6>
                        <h2 class="text-danger"
                            th:text="${dashboard.totalAdmins}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Trabalhadores
                        </h6>
                        <h2 class="text-primary"
                            th:text="${dashboard.totalStaff}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <h6 class="text-muted">
                            Frequentadores
                        </h6>
                        <h2 class="text-success"
                            th:text="${dashboard.totalFrequentUsers}">
                            0
                        </h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

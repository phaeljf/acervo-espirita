<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Configurações')}"></head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <div th:replace="~{fragments/topbar :: topbar('Configurações')}"></div>
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        <!-- CONFIGURAÇÕES -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/configuration}" method="post">
                    <div class="mb-4">
                        <h5 class="fw-bold mb-3">
                            Empréstimos
                        </h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">
                                    Máximo de Livros por Empréstimo
                                </label>
                                <input type="number"
                                       name="maxBooksPerLoan"
                                       class="form-control"
                                       min="1"
                                       th:value="${configuration.maxBooksPerLoan}"
                                       required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">
                                    Dias Limite de Empréstimo
                                </label>
                                <input type="number"
                                       name="loanDaysLimit"
                                       class="form-control"
                                       min="0"
                                       th:value="${configuration.loanDaysLimit}"
                                       required>
                                <div class="form-text">
                                    0 = sem vencimento
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">
                                    Permitir Renovação
                                </label>
                                <select name="allowRenewal"
                                        class="form-select">
                                    <option value="true"
                                            th:selected="${configuration.allowRenewal}">
                                        Sim
                                    </option>
                                    <option value="false"
                                            th:selected="${!configuration.allowRenewal}">
                                        Não
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            Salvar Configurações
                        </button>
                        <a href="/dashboard" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
        <!-- BACKUP -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="fw-bold mb-3">
                    Backup do Sistema
                </h5>
                <p class="text-muted">
                    Gere um backup completo do sistema para restaurar em outro computador futuramente.
                </p>
                <form th:action="@{/backup}" method="post">
                    <button type="submit" class="btn btn-success">
                        Gerar Backup
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

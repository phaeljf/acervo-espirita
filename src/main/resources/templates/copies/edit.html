<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar Exemplar')}"></head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <div th:replace="~{fragments/topbar :: topbar('Editar Exemplar')}"></div>
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/copies/{id}/edit(id=${copy.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Livro</label>
                        <input type="text" class="form-control" th:value="${copy.book.title}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prateleira</label>
                        <select name="shelfPositionId" class="form-select">
                            <option th:each="position : ${positions}" th:value="${position.id}" th:text="${position.fullPosition}" th:selected="${copy.shelfPosition != null and copy.shelfPosition.id == position.id}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Código</label>
                        <input type="text" name="code" class="form-control" th:value="${copy.code}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.description}" th:selected="${copy.status == status}"></option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <a th:href="@{/copies/book/{id}(id=${copy.book.id})}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Novo Exemplar')}"></head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="flex-grow-1 p-4">
        <div th:replace="~{fragments/topbar :: topbar('Novo Exemplar')}"></div>
        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/copies}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Livro</label>
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <input type="text" class="form-control" th:value="${book.title}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prateleira</label>
                        <select name="shelfPositionId" class="form-select">
                            <option value="">Selecione uma prateleira</option>
                            <option th:each="position : ${positions}" th:value="${position.id}" th:text="${position.fullPosition}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Código do Exemplar</label>
                        <input type="text" name="code" class="form-control" placeholder="Opcional">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <a href="/copies" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
